name: flutter_app
description: "ChatGPT-like Flutter application with GetX and OpenAI PDF-RAG backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.7.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  record: ^5.2.0
  shared_preferences: ^2.3.5
  intl: ^0.20.1

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
